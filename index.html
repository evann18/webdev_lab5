<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volunteer Form</title>
</head>

<body>
  <h1>Volunteer Form</h1>

	<form action = "http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php" method="POST">
    <fieldset>
      <legend>My Info</legend>
      <div>
        <label for="fname">first name:</label>
        <input type="text" id="fname" name="first_name_field" required>
      </div>

      <div>
        <label for="lname">last name:</label>
        <input type="text" id="lname" name="last_name_field" required>
      </div>

      <div>
        <label for="phone">phone:</label>
        <input type="tel" id="phone" name="phone_field" required>
      </div>

      <div>
        <label for="email">email:</label>
        <input type="email" id="email" name="email_field" required>
      </div>

      <label for="gender_field">Gender:</label>
      <div>
        <label for="gender_field">Male</label>
        <input type="radio" id="gender_field" name="gender_field" value="male" required>
        <label for="fgender_field">Female</label>
        <input type="radio" id="fgender_field" name="gender_field" value="female" required>
      </div>

      <label for="age_field">Age:</label>
      <div>
        <select id="age_field" name="age_field">
          <option value="under 18">under 18</option>
          <option value="over 18">over 18</option>
        </select>
      </div>
    </fieldset>

    <fieldset>
      <legend>My Availability</legend>
      <h2>Days Available:</h2>
      <div>
        <label for="sunday">Sunday</label>
        <input type="checkbox" id="sunday" name="available_field[]" value="sunday">
      </div>
      <div>
        <label for="monday">Monday</label>
        <input type="checkbox" id="monday" name="available_field[]" value="monday">
      </div>
      <div>
        <label for="tuesday">Tuesday</label>
        <input type="checkbox" id="tuesday" name="available_field[]" value="tuesday">
      </div>
      <div>
        <label for="wednesday">Wednesday</label>
        <input type="checkbox" id="wednesday" name="available_field[]" value="wednesday">
      </div>
      <div>
        <label for="thursday">Thursday</label>
        <input type="checkbox" id="thursday" name="available_field[]" value="thursday">
      </div>
        <div>
          <label for="friday">Friday</label>
          <input type="checkbox" id="friday" name="available_field[]" value="friday">
        </div>
      <div>
        <label for="saturday">Saturday</label>
        <input type="checkbox" id="saturday" name="available_field[]" value="saturday">
      </div>

      <h2>Comments</h2>
      <div>
        <textarea name="comments_field"></textarea>
      </div>
    </fieldset>

    <input type="hidden" name="hidden_field" value="Evan Nickolaou">
    <input type="submit" value="Submit Query">
  </form>

</body>
</html>
